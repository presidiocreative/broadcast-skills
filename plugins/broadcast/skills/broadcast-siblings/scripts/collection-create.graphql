# Manual collection grouping one sibling set. Handle must equal each sibling's theme.siblings value.
# Variables example:
# {"input":{"title":"Siblings – Antigravity","handle":"siblings-antigravity","sortOrder":"MANUAL",
#   "products":["gid://shopify/Product/1","gid://shopify/Product/2","gid://shopify/Product/3"]}}
mutation SiblingCollection($input: CollectionInput!) {
  collectionCreate(input: $input) {
    collection { id handle productsCount { count } }
    userErrors { field message }
  }
}

