# List option values with their resolved swatches (native) so you can see what is unmapped.
query SwatchValues($first: Int = 50, $after: String) {
  products(first: $first, after: $after, query: "status:active") {
    pageInfo { hasNextPage endCursor }
    nodes {
      handle
      options {
        name
        linkedMetafield { namespace key }
        optionValues { name swatch { color image { image { url } } } }
      }
    }
  }
}
